; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; 按模块运行：底部 Status Bar 切换 env，再 Build / Upload。
; 新增模块：在 src/ 下建目录（如 02_xxx），并在下方加对应 [env:...]

[platformio]
default_envs = 01_I2C-scan

[env]
platform = espressif32
board = esp32s3box
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:01_I2C-scan]
extends = env
build_src_filter = -<*> +<01_I2C-scan/>

[env:02_I2C-IMU]
extends = env
build_src_filter = -<*> +<02_I2C-IMU/>

[env:03_I2C-GT911-poll-status]
extends = env
build_src_filter = -<*> +<03_I2C-GT911-poll-status/>

[env:04_I2C-GT911-interrupt]
extends = env
build_src_filter = -<*> +<04_I2C-GT911-interrupt/>

[env:05_I2C-GT911-interrupt-multi-points]
extends = env
build_src_filter = -<*> +<05_I2C-GT911-interrupt-multi-points/>

[env:06_SPI-LCD]
extends = env
build_src_filter = -<*> +<06_SPI-LCD/>

[env:07_SPI-LCD-draw-graph]
extends = env
build_src_filter = -<*> +<07_SPI-LCD-draw-graph/>

[env:08_SPI-LCD-text]
extends = env
build_src_filter = -<*> +<08_SPI-LCD-text/>

[env:09_SPI-LCD-image]
extends = env
build_src_filter = -<*> +<09_SPI-LCD-image/>

[env:10_SPI-LCD-touch-button]
extends = env
build_src_filter = -<*> +<10_SPI-LCD-touch-button/>

[env:11_SPI-LCD-touch-paint]
extends = env
build_src_filter = -<*> +<11_SPI-LCD-touch-paint/>

[env:12_LVGL-controls]
extends = env
build_src_filter = -<*> +<12_LVGL-controls/>
lib_deps =
    lvgl/lvgl@9.5.0
build_flags =
    ${env.build_flags}
    -I include
    -DLV_CONF_INCLUDE_SIMPLE

[env:13_LVGL-hello-backlight]
extends = env
build_src_filter = -<*> +<13_LVGL-hello-backlight/>
lib_deps =
    lvgl/lvgl@9.5.0
build_flags =
    ${env.build_flags}
    -I include
    -DLV_CONF_INCLUDE_SIMPLE

[env:14_SDMMC-TF-test]
extends = env
build_src_filter = -<*> +<14_SDMMC-TF-test/>

[env:15_I2S-audio-tone]
extends = env
build_src_filter = -<*> +<15_I2S-audio-tone/>
